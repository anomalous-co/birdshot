name: Build & Publish Birdshot Extension

# Builds birdshot for every default DuckDB target and publishes to Cloudflare R2.
#
# Build is delegated to DuckDB's official reusable workflow
# (duckdb/extension-ci-tools) so vcpkg handles OpenSSL + cross-compilation +
# emscripten + MSVC correctly on every platform — hand-rolling that (esp. wasm,
# mingw, and cross-compiled osx_amd64) is not maintainable.
#
# With no exclude_archs, the matrix builds all targets flagged opt_in:false in
# extension-ci-tools/config/distribution_matrix.json:
#   linux_amd64, linux_arm64, osx_amd64, osx_arm64,
#   windows_amd64, windows_amd64_mingw, wasm_mvp, wasm_eh, wasm_threads
#
# R2 layout (served via CDN at https://ext.duckbase.io):
#   native: v1.5.3/<platform>/birdshot.duckdb_extension.gz            (gzip)
#   wasm:   duckdb-wasm/v1.5.3/<platform>/birdshot.duckdb_extension.wasm
# The duckdb-wasm/ prefix + .wasm suffix is what the DuckDB-Wasm loader expects.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  DUCKDB_VERSION: v1.5.3
  R2_BUCKET: duckbase-ext

jobs:
  # ── Build all platforms via DuckDB's reusable workflow ───────────────────────
  build:
    name: Build
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@a00c74e02aefbfa3fd31a4c74c4b6bc260af0de7
    with:
      extension_name: birdshot
      duckdb_version: v1.5.3
      # Pin ci_tools to the same commit our submodule tracks (origin/main @ 2026-06-04).
      ci_tools_version: a00c74e02aefbfa3fd31a4c74c4b6bc260af0de7
      # vcpkg commit pinned by DuckDB v1.5.3 (duckdb/.github/workflows/Main.yml).
      vcpkg_commit: 84bab45d415d22042bd0b9081aea57f362da3f35
      # Tests assume the gateway/JWT control-plane context; skip in the build CI.
      skip_tests: true

  # ── Publish every artifact to Cloudflare R2 ──────────────────────────────────
  publish:
    name: Publish to R2
    needs: build
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      # R2 rejects the default streaming checksum trailer the AWS CLI v2 now sends.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: birdshot-${{ env.DUCKDB_VERSION }}-extension-*

      - name: Publish to Cloudflare R2
        run: |
          set -euo pipefail
          ENDPOINT="https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          VERSION="${DUCKDB_VERSION}"
          shopt -s nullglob

          published=0
          for dir in artifacts/birdshot-${VERSION}-extension-*/; do
            arch="${dir#*-extension-}"; arch="${arch%/}"

            if [[ "$arch" == wasm_* ]]; then
              # WASM: served raw at duckdb-wasm/<ver>/<platform>/...wasm.
              # The browser loader fetches this directly; Cloudflare handles
              # transfer compression. Content-Type must be application/wasm.
              src="${dir}birdshot.duckdb_extension.wasm"
              dest="s3://${R2_BUCKET}/duckdb-wasm/${VERSION}/${arch}/birdshot.duckdb_extension.wasm"
              aws s3 cp "$src" "$dest" \
                --endpoint-url "$ENDPOINT" \
                --content-type "application/wasm" \
                --no-progress
            else
              # Native: gzip then upload to <ver>/<platform>/...gz.
              src="${dir}birdshot.duckdb_extension"
              gzip -c "$src" > /tmp/${arch}.gz
              dest="s3://${R2_BUCKET}/${VERSION}/${arch}/birdshot.duckdb_extension.gz"
              aws s3 cp "/tmp/${arch}.gz" "$dest" \
                --endpoint-url "$ENDPOINT" \
                --content-type "application/octet-stream" \
                --no-progress
            fi
            echo "Published: ${dest}"
            published=$((published + 1))
          done

          if [[ "${published}" -eq 0 ]]; then
            echo "ERROR: no artifacts found to publish" >&2
            exit 1
          fi
          echo "PUBLISHED_COUNT=${published}" >> "$GITHUB_ENV"

      - name: Summary
        run: |
          {
            echo "## Birdshot published to R2 (${PUBLISHED_COUNT} targets)"
            echo ""
            echo "**Native install:**"
            echo '```sql'
            echo "SET allow_unsigned_extensions = true;"
            echo "INSTALL birdshot FROM 'https://ext.duckbase.io';"
            echo "LOAD birdshot;"
            echo '```'
            echo ""
            echo "**DuckDB-Wasm** (autoloads from custom repo):"
            echo '```sql'
            echo "SET custom_extension_repository = 'https://ext.duckbase.io';"
            echo "LOAD birdshot;"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
