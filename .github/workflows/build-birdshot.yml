name: Build & Publish Birdshot Extension

# Builds birdshot for every default DuckDB target and publishes to Google Cloud Storage.
#
# Build is delegated to DuckDB's official reusable workflow
# (duckdb/extension-ci-tools) so vcpkg handles OpenSSL + cross-compilation +
# emscripten + MSVC correctly on every platform — hand-rolling that (esp. wasm,
# mingw, and cross-compiled osx_amd64) is not maintainable.
#
# With no exclude_archs, the matrix builds all targets flagged opt_in:false in
# extension-ci-tools/config/distribution_matrix.json:
#   linux_amd64, linux_arm64, osx_amd64, osx_arm64,
#   windows_amd64, windows_amd64_mingw, wasm_mvp, wasm_eh, wasm_threads
#
# GCS layout (gs://waddling-ext; consumed by the gateway image build + deploy-cutover.sh):
#   native: v1.5.3/<platform>/birdshot.duckdb_extension.gz            (gzip)
#   wasm:   duckdb-wasm/v1.5.3/<platform>/birdshot.duckdb_extension.wasm
# The duckdb-wasm/ prefix + .wasm suffix is what the DuckDB-Wasm loader expects.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  DUCKDB_VERSION: v1.5.3

jobs:
  # ── Build all platforms via DuckDB's reusable workflow ───────────────────────
  build:
    name: Build
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@a00c74e02aefbfa3fd31a4c74c4b6bc260af0de7
    with:
      extension_name: birdshot
      duckdb_version: v1.5.3
      # Pin ci_tools to the same commit our submodule tracks (origin/main @ 2026-06-04).
      ci_tools_version: a00c74e02aefbfa3fd31a4c74c4b6bc260af0de7
      # vcpkg commit pinned by DuckDB v1.5.3 (duckdb/.github/workflows/Main.yml).
      vcpkg_commit: 84bab45d415d22042bd0b9081aea57f362da3f35
      # Tests assume the gateway/JWT control-plane context; skip in the build CI.
      skip_tests: true
      # Windows temporarily excluded: DuckDB v1.5.3's vendored fmt fails under
      # this MSVC (stdext::checked_array_iterator removed). Re-add once resolved.
      # Builds: linux_amd64, linux_arm64, osx_amd64, osx_arm64,
      #         wasm_mvp, wasm_eh, wasm_threads
      exclude_archs: 'windows_amd64;windows_amd64_mingw'
      # Run every platform independently: 'disabled' turns OFF fail-fast AND the
      # "osx/wasm only if linux succeeded" gate. linux_arm64 cold-builds DuckDB from
      # source on a 16GB native arm64 runner and intermittently OOMs (exit 137); with
      # fail-fast that one leg cancels osx/wasm and skips publish. Decoupling them lets
      # every other target (incl. the prod linux_amd64) build and publish regardless.
      reduced_ci_mode: 'disabled'

  # ── Publish every artifact to Google Cloud Storage ───────────────────────────
  # All waddling infra is GCP (only the UI + DNS are on Cloudflare), so birdshot
  # extensions live in gs://waddling-ext — NOT the retired Cloudflare R2 CDN at
  # ext.getwaddling.com (which now 404s through the GCP router). The gateway/workspace
  # Cloud Run image build + infra/gcp/deploy-cutover.sh bake the linux_amd64 binary
  # from this bucket.
  #
  # ONE-TIME GCP SETUP (governed — run via gcloud/console, NOT this workflow):
  #   1. bucket:  gcloud storage buckets create gs://waddling-ext --location=us-west1 \
  #                 --uniform-bucket-level-access --project=<PROJECT>
  #   2. CI service account with object-admin on the bucket:
  #        gcloud iam service-accounts create birdshot-ci --project=<PROJECT>
  #        gcloud storage buckets add-iam-policy-binding gs://waddling-ext \
  #          --member=serviceAccount:birdshot-ci@<PROJECT>.iam.gserviceaccount.com \
  #          --role=roles/storage.objectAdmin
  #   3. Workload Identity Federation (keyless) for this repo — create a WIF pool +
  #      github-actions provider and let this repo impersonate birdshot-ci.
  #   4. GitHub repo secrets:
  #        GCP_WIF_PROVIDER = projects/<N>/locations/global/workloadIdentityPools/<pool>/providers/<prov>
  #        GCP_CI_SA        = birdshot-ci@<PROJECT>.iam.gserviceaccount.com
  publish:
    name: Publish to GCS
    needs: build
    # always() so a single failed/flaky build leg (e.g. linux_arm64 OOM) does NOT skip
    # publish: it downloads whatever artifacts DID upload and ships them. The publish
    # step still errors if ZERO artifacts are present, so a fully-broken build can't
    # silently no-op. (Each target overwrites only its own object key, so a missing leg
    # leaves that platform's prior artifact in place rather than deleting it.)
    if: always() && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write        # required for keyless Workload Identity Federation
    env:
      GCS_BUCKET: waddling-ext
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: birdshot-${{ env.DUCKDB_VERSION }}-extension-*

      - name: Authenticate to Google Cloud (keyless WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_CI_SA }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Publish to GCS
        run: |
          set -euo pipefail
          VERSION="${DUCKDB_VERSION}"
          shopt -s nullglob

          published=0
          for dir in artifacts/birdshot-${VERSION}-extension-*/; do
            arch="${dir#*-extension-}"; arch="${arch%/}"

            if [[ "$arch" == wasm_* ]]; then
              # WASM: served raw at duckdb-wasm/<ver>/<platform>/...wasm — the
              # DuckDB-Wasm loader fetches it directly. Content-Type application/wasm.
              src="${dir}birdshot.duckdb_extension.wasm"
              dest="gs://${GCS_BUCKET}/duckdb-wasm/${VERSION}/${arch}/birdshot.duckdb_extension.wasm"
              gcloud storage cp "$src" "$dest" --content-type="application/wasm"
            else
              # Native: gzip then upload to <ver>/<platform>/...gz.
              src="${dir}birdshot.duckdb_extension"
              gzip -c "$src" > /tmp/${arch}.gz
              dest="gs://${GCS_BUCKET}/${VERSION}/${arch}/birdshot.duckdb_extension.gz"
              gcloud storage cp "/tmp/${arch}.gz" "$dest" --content-type="application/octet-stream"
            fi
            echo "Published: ${dest}"
            published=$((published + 1))
          done

          if [[ "${published}" -eq 0 ]]; then
            echo "ERROR: no artifacts found to publish" >&2
            exit 1
          fi
          echo "PUBLISHED_COUNT=${published}" >> "$GITHUB_ENV"

      - name: Summary
        run: |
          {
            echo "## Birdshot published to GCS (${PUBLISHED_COUNT} targets → gs://${GCS_BUCKET})"
            echo ""
            echo "Native: \`gs://${GCS_BUCKET}/${DUCKDB_VERSION}/<platform>/birdshot.duckdb_extension.gz\`"
            echo "Wasm:   \`gs://${GCS_BUCKET}/duckdb-wasm/${DUCKDB_VERSION}/<platform>/birdshot.duckdb_extension.wasm\`"
            echo ""
            echo "The gateway/workspace Cloud Run image build + \`infra/gcp/deploy-cutover.sh\` bake the"
            echo "linux_amd64 binary from this bucket (\`gcloud storage cp gs://${GCS_BUCKET}/...\`)."
          } >> "$GITHUB_STEP_SUMMARY"
